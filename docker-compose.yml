version: "3.9"

x-variables:
  project_name: &project_name rox
  postgres_user: &postgres_user postgres
  postgres_password: &postgres_password postgres

services:
  web:
    build: .
    container_name: rox_backend
    restart: always
    command: uv run gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DEF_DB_ENGINE: django.db.backends.postgresql
      DEF_DB_NAME: *project_name
      DEF_DB_USER: *postgres_user
      DEF_DB_PASSWORD: *postgres_password
      DEF_DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      C_FORCE_ROOT: "true"
    entrypoint:
      - /entrypoint.sh
    ports:
      - "8080:8000"
    networks:
      - rox_backend_default
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery_worker:
    build: .
    container_name: rox_celery_worker
    command: uv run celery -A app worker --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DEF_DB_ENGINE: django.db.backends.postgresql
      DEF_DB_NAME: *project_name
      DEF_DB_USER: *postgres_user
      DEF_DB_PASSWORD: *postgres_password
      DEF_DB_HOST: db
      C_FORCE_ROOT: "true"
    networks:
      - rox_backend_default

  celery_beat:
    build: .
    container_name: rox_celery_beat
    command: uv run celery -A app beat --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DEF_DB_ENGINE: django.db.backends.postgresql
      DEF_DB_NAME: *project_name
      DEF_DB_USER: *postgres_user
      DEF_DB_PASSWORD: *postgres_password
      DEF_DB_HOST: db
      C_FORCE_ROOT: "true"
    networks:
      - rox_backend_default

  db:
    image: postgres:17-alpine
    container_name: rox_postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: *project_name
      POSTGRES_USER: *postgres_user
      POSTGRES_PASSWORD: *postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=trust"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rox_backend_default

  redis:
    image: redis:alpine
    container_name: rox_redis_cache
    restart: always
    networks:
      - rox_backend_default

volumes:
  postgres_data:
  static_volume:

networks:
  rox_backend_default:
    driver: bridge
