name: ${COMPOSE_PROJECT_NAME:-myproject}

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-environment: &app_environment
  DB_NAME: ${DB_NAME:-myproject}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  RUN_MIGRATIONS: "false"
  RUN_COLLECTSTATIC: "false"

x-app-service: &app_service
  image: ${COMPOSE_PROJECT_NAME:-myproject}-backend:latest
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *app_environment
  logging: *default_logging
  networks:
    - app_network

services:
  db:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_db
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-2g}
    logging: *default_logging
    environment:
      POSTGRES_DB: ${DB_NAME:-myproject}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "${HOST_FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  redis:
    image: redis:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  web:
    <<: *app_service
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_web
    mem_limit: ${WEB_MEM_LIMIT:-2g}
    environment:
      <<: *app_environment
      RUN_MIGRATIONS: "true"
      RUN_COLLECTSTATIC: "true"
    command: >
      sh -c "gunicorn app.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${WEB_CONCURRENCY:-2}
      --timeout=$${GUNICORN_TIMEOUT:-360}
      --graceful-timeout=$${GUNICORN_GRACEFUL_TIMEOUT:-120}
      --keep-alive=$${GUNICORN_KEEPALIVE:-10}
      --max-requests=$${GUNICORN_MAX_REQUESTS:-1000}
      --max-requests-jitter=$${GUNICORN_MAX_REQUESTS_JITTER:-100}
      --access-logfile -
      --error-logfile -"
    volumes:
      - media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "${HOST_FORWARD_APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *app_service
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_worker
    command: >
      sh -c "celery -A app worker
      --loglevel=INFO
      --concurrency=$${CELERY_WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=$${CELERY_WORKER_MAX_TASKS_PER_CHILD:-20}
      --prefetch-multiplier=$${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}"
    volumes:
      - media:/app/media
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *app_service
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_beat
    command: >
      celery -A app beat --loglevel=INFO
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      web:
        condition: service_healthy

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME:-myproject}_network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media:
