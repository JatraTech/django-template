{% load i18n %}

<span class="flex shrink-0 flex-nowrap items-center gap-2 font-medium {% if size_class %}{{ size_class }}{% else %}text-xs{% endif %}">
{% if change_url %}
<a href="{{ change_url }}" class="inline-flex shrink-0 items-center gap-1 whitespace-nowrap text-primary-600 dark:text-primary-500">
<span class="material-symbols-outlined text-base leading-none" aria-hidden="true">edit_square</span>
{% trans "Edit" %}
</a>
{% endif %}
{% if change_url and delete_url %}
<span class="bg-base-300 inline-block h-3 w-px shrink-0 dark:bg-base-700"></span>
{% endif %}
{% if delete_url %}
<a href="{{ delete_url }}" class="inline-flex shrink-0 items-center gap-1 whitespace-nowrap text-red-600 dark:text-red-500">
<span class="material-symbols-outlined text-base leading-none" aria-hidden="true">delete</span>
{% trans "Delete" %}
</a>
{% endif %}
</span>
