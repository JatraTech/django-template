{% load backstage i18n %}

{% with avatar_url=user.avatar_url %}
<div
 class="backstage-avatar{% if size == 'md' %} backstage-avatar--md{% elif size == 'sm' %} backstage-avatar--sm{% elif size == 'xs' %} backstage-avatar--xs{% else %} backstage-avatar--lg{% endif %}{% if avatar_url %} backstage-avatar--photo{% else %} backstage-avatar--initials{% endif %}"
 {% if avatar_url %}style="background-image: url('{{ avatar_url }}');"{% endif %}
 role="img"
 aria-label="{% if avatar_url %}{% trans 'User avatar' %}{% else %}{{ user.get_full_name|default:user.get_username }}{% endif %}"
>
 {% if not avatar_url %}{{ user|user_initials }}{% endif %}
</div>
{% endwith %}
