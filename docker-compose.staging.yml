# Staging stack — separate project name / image tag from production on the same host.
# Use with: docker compose -f docker-compose.staging.yml up -d
# Set COMPOSE_PROJECT_NAME in .env (e.g. myproject-staging) on the staging server.

name: ${COMPOSE_PROJECT_NAME:-myproject}-staging

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-common-env: &common_env
  DB_NAME: ${DB_NAME:-myproject}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  RUN_MIGRATIONS: "false"
  RUN_COLLECTSTATIC: "false"

# Shared runtime anchor; build only on `web` (avoids parallel tag race on `docker compose up --build`).
x-common-runtime: &common_runtime
  image: ${COMPOSE_PROJECT_NAME:-myproject}-backend:staging
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *common_env
  logging: *default_logging
  networks:
    - app_net

x-common-service: &common_service
  <<: *common_runtime
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}

services:
  db:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_staging_db
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-2g}
    logging: *default_logging
    environment:
      POSTGRES_DB: ${DB_NAME:-myproject}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "${HOST_FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  redis:
    image: redis:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_staging_redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    logging: *default_logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  web:
    <<: *common_service
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_staging_web
    mem_limit: ${WEB_MEM_LIMIT:-2g}
    environment:
      <<: *common_env
      RUN_MIGRATIONS: "true"
      RUN_COLLECTSTATIC: "true"
    # --- HTTP server: pick one (comment/uncomment `command`) ---
    # Default: Gunicorn (WSGI). For ASGI (e.g. Channels), comment gunicorn and uncomment uvicorn below.
    command: >
      sh -c "gunicorn app.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${WEB_CONCURRENCY:-2}
      --timeout=$${GUNICORN_TIMEOUT:-360}
      --graceful-timeout=$${GUNICORN_GRACEFUL_TIMEOUT:-120}
      --keep-alive=$${GUNICORN_KEEPALIVE:-10}
      --max-requests=$${GUNICORN_MAX_REQUESTS:-1000}
      --max-requests-jitter=$${GUNICORN_MAX_REQUESTS_JITTER:-100}
      --access-logfile -
      --error-logfile -"
    # command: >
    #   sh -c "uvicorn app.asgi:application
    #   --host 0.0.0.0
    #   --port 8000
    #   --workers $${WEB_CONCURRENCY:-2}
    #   --timeout-keep-alive $${UVICORN_KEEPALIVE_TIMEOUT:-10}
    #   --proxy-headers
    #   --forwarded-allow-ips='*'
    #   --log-level info"
    volumes:
      - media_data:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      # App listens on 8000 in-container; host = HOST_FORWARD_APP_PORT. Set HOST_BIND_ADDRESS=0.0.0.0 for LAN access.
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_FORWARD_APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *common_runtime
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_staging_worker
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    stop_grace_period: 30s
    command: >
      sh -c "celery -A app worker
      --loglevel=INFO
      --concurrency=$${CELERY_WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=$${CELERY_WORKER_MAX_TASKS_PER_CHILD:-20}
      --prefetch-multiplier=$${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}"
    volumes:
      - media_data:/app/media
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *common_runtime
    container_name: ${COMPOSE_PROJECT_NAME:-myproject}_staging_beat
    mem_limit: ${BEAT_MEM_LIMIT:-1g}
    stop_grace_period: 30s
    command: >
      celery -A app beat --loglevel=INFO
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      web:
        condition: service_healthy

networks:
  app_net:
    name: ${COMPOSE_PROJECT_NAME:-myproject}_staging_net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
