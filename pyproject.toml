[project]
name = "myproject-backend"
version = "0.1.0"
description = "Django REST API template with Celery, Redis, PostgreSQL, and Docker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.5.3",
    "django>=5.2.7",
    "django-celery-beat>=2.8.1",
    "django-celery-results>=2.6.0",
    "django-cleanup>=9.0.0",
    "django-cors-headers>=4.9.0",
    "django-extensions>=4.1",
    "django-filter>=25.2",
    "django-storages[s3]>=1.14.6",
    "django-userforeignkey>=0.5.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-nested-routers>=0.95.0",
    "drf-spectacular>=0.28.0",
    "drf-standardized-errors>=0.15.0",
    "environs>=14.3.0",
    "google-api-python-client>=2.184.0",
    "google-auth[pyopenssl]>=2.41.1",
    "google-auth-oauthlib>=1.2.2",
    "gunicorn>=23.0.0",
    "pillow>=11.3.0",
    "polars>=1.34.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.10",
    "python-logging-loki>=0.3.1",
    "redis>=5.2.1",
    "requests>=2.32.5",
    "styleframe>=4.2",
    "django-tinymce>=5.0.0",
    "markdown>=3.7",
]

[dependency-groups]
dev = [
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "ipykernel>=6.30.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db -p no:cacheprovider"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "DJ", "N", "W"]
ignore = [
    "E501",
    "E402",
    "E731",
    "E741",
    "W291",
    "N802",
    "N806",
    "N814",
    "F841",
    "B007",
    "B904",
    "B905",
    "DJ008",
]
fixable = ["ALL"]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "app.settings"
