name: Staging Deployment Workflow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_REMOTE_HOST }}
          username: ${{ secrets.STAGING_REMOTE_USERNAME }}
          key: ${{ secrets.STAGING_REMOTE_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/cohostrs_backend
            git reset --hard
            git pull
            docker-compose restart
